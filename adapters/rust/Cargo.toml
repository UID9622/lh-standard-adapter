[package]
name = "lh-standard-adapter"
version = "1.0.0"
edition = "2021"
authors = ["LongHun Core <core@longhun.org>", "rushikeshgarad2024-dev"]
description = "Rust adapter for AI Traceability and Audit Protocol v1.0"
license = "CC-BY-NC-SA-4.0"

[dependencies]
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
hex = "0.4"
