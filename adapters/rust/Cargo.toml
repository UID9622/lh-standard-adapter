[package]
name = "lh-standard-adapter"
version = "1.0.0"
edition = "2021"
authors = ["LongHun Community <community@longhun.org>"]
description = "Rust Adapter for LongHun AI Traceability & Audit Protocol v1.0"
license = "CC-BY-NC-SA-4.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
