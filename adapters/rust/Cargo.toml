[package]
name = "lh-standard-adapter"
version = "0.1.0"
edition = "2021"
license = "CC-BY-NC-SA-4.0"
authors = ["LongHun Community"]
description = "LongHun AI Traceability Audit Protocol adapter for Rust"
repository = "https://github.com/seayniclabs/longhun"
keywords = ["longhun", "ai", "traceability", "audit"]
categories = ["development-tools"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]

[lib]
name = "lh_standard_adapter"
path = "src/lib.rs"
